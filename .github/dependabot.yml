# Weekly update PRs for the Actions SHA pins and the Python lockfiles.
# Every PR runs the full CI. lock-check recompiles from the committed locks,
# so a pin Dependabot bumps in requirements*.txt is kept as long as it still
# satisfies requirements*.in. If no Python PR has appeared within two weeks of
# this landing, add a scheduled lock-refresh workflow instead.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
